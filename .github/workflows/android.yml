# Fabrique l'appli Android à chaque mise à jour du code, et la publie
# dans « Releases » sous un nom fixe : cerveau-externe.apk
name: Fabriquer l'appli Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code (types + tests)
        run: |
          npx tsc --noEmit
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Configurer la signature
        env:
          CE_KEYSTORE_PASSWORD: ${{ secrets.CE_KEYSTORE_PASSWORD }}
          CE_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$CE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Le secret CE_KEYSTORE_PASSWORD manque (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          node scripts/patch-android.js

      - name: Fabriquer l'APK
        working-directory: android
        env:
          CE_KEYSTORE_PATH: ${{ github.workspace }}/signing/cerveau-externe.jks
          CE_KEYSTORE_PASSWORD: ${{ secrets.CE_KEYSTORE_PASSWORD }}
          CE_KEY_ALIAS: cerveau-externe
          CE_KEY_PASSWORD: ${{ secrets.CE_KEYSTORE_PASSWORD }}
          # Numéro de cette version, lu par l'appli pour savoir si une plus récente existe (src/update).
          EXPO_PUBLIC_CE_BUILD: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publier la nouvelle version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cerveau-externe.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" cerveau-externe.apk \
            --title "Cerveau Externe $TAG" \
            --notes "$(git log -1 --pretty=%s)" \
            --latest

      # Copie publique pour les testeurs (le dépôt du code reste privé) :
      # github.com/tdahsanslimite/cerveau-externe-telechargement/releases/latest
      - name: Publier dans le dépôt public de téléchargement
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Le secret RELEASES_TOKEN manque : pas de copie publique."
            exit 0
          fi
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" cerveau-externe.apk \
            --repo tdahsanslimite/cerveau-externe-telechargement \
            --title "LCE, le cerveau externe — $TAG" \
            --notes "Télécharge cerveau-externe.apk ci-dessous, puis ouvre-le sur ton téléphone Android pour l'installer (ou le mettre à jour : tes données sont conservées)." \
            --latest

  # Version web (pour l'iPhone, 12 nov.) : publiée sur GitHub Pages du dépôt public de téléchargement,
  # https://tdahsanslimite.github.io/cerveau-externe-telechargement/ (branche gh-pages, remplacée à chaque version).
  # Indépendante de l'APK : un échec Android n'empêche pas la version web, et inversement.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code (types + tests)
        run: |
          npx tsc --noEmit
          npm test

      - name: Exporter la version web
        env:
          CE_WEB_BASE_URL: /cerveau-externe-telechargement
        run: |
          npx expo export --platform web --output-dir web-dist
          node scripts/patch-web.js web-dist /cerveau-externe-telechargement

      - name: Publier sur GitHub Pages (dépôt public)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Le secret RELEASES_TOKEN manque : pas de version web."
            exit 0
          fi
          cd web-dist
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Version web : $(cd .. && git log -1 --pretty=%s)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/tdahsanslimite/cerveau-externe-telechargement.git" gh-pages
          # Active Pages la première fois (marche seulement si le jeton a le droit « Pages » ; sinon à faire à la main :
          # Settings › Pages › Deploy from a branch › gh-pages / root).
          gh api -X POST repos/tdahsanslimite/cerveau-externe-telechargement/pages \
            -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1 \
            && echo "GitHub Pages activé." \
            || echo "::notice::Pages déjà activé, ou à activer à la main (Settings › Pages › gh-pages)."
