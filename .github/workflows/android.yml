# Fabrique l'appli Android à chaque mise à jour du code, et la publie
# dans « Releases » sous un nom fixe : cerveau-externe.apk
name: Fabriquer l'appli Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code (types + tests)
        run: |
          npx tsc --noEmit
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Configurer la signature
        env:
          CE_KEYSTORE_PASSWORD: ${{ secrets.CE_KEYSTORE_PASSWORD }}
          CE_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$CE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Le secret CE_KEYSTORE_PASSWORD manque (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          node scripts/patch-android.js

      - name: Fabriquer l'APK
        working-directory: android
        env:
          CE_KEYSTORE_PATH: ${{ github.workspace }}/signing/cerveau-externe.jks
          CE_KEYSTORE_PASSWORD: ${{ secrets.CE_KEYSTORE_PASSWORD }}
          CE_KEY_ALIAS: cerveau-externe
          CE_KEY_PASSWORD: ${{ secrets.CE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publier la nouvelle version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cerveau-externe.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" cerveau-externe.apk \
            --title "Cerveau Externe $TAG" \
            --notes "$(git log -1 --pretty=%s)" \
            --latest

      # Copie publique pour les testeurs (le dépôt du code reste privé) :
      # github.com/tdahsanslimite/cerveau-externe-telechargement/releases/latest
      - name: Publier dans le dépôt public de téléchargement
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Le secret RELEASES_TOKEN manque : pas de copie publique."
            exit 0
          fi
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" cerveau-externe.apk \
            --repo tdahsanslimite/cerveau-externe-telechargement \
            --title "LCE, le cerveau externe — $TAG" \
            --notes "Télécharge cerveau-externe.apk ci-dessous, puis ouvre-le sur ton téléphone Android pour l'installer (ou le mettre à jour : tes données sont conservées)." \
            --latest

      # Copie publique : seulement l'APK, dans le dépôt public (lien de téléchargement des testeurs).
      # Jeton limité à ce dépôt, rangé dans le secret RELEASES_TOKEN. Sans lui, l'étape est sautée.
      - name: Publier dans le dépôt public de téléchargement
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret RELEASES_TOKEN absent : pas de copie publique."
            exit 0
          fi
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" cerveau-externe.apk \
            --repo tdahsanslimite/cerveau-externe-telechargement \
            --title "LCE — Cerveau Externe $TAG" \
            --notes "Nouvelle version de LCE, le cerveau externe pour les TDAH. Télécharge cerveau-externe.apk et installe-le par-dessus l'ancienne version : tes données sont conservées." \
            --latest

      # Copie publique pour les testeurs : dépôt public tdahsanslimite/cerveau-externe-telechargement
      # (lien à donner : github.com/tdahsanslimite/cerveau-externe-telechargement/releases/latest).
      # Jeton limité à ce dépôt, rangé dans le secret RELEASES_TOKEN. Un échec ici n'empêche pas la version privée.
      - name: Publier pour les testeurs (dépôt public)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Le secret RELEASES_TOKEN manque : pas de copie publique."
            exit 1
          fi
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" cerveau-externe.apk \
            --repo tdahsanslimite/cerveau-externe-telechargement \
            --title "LCE — Cerveau Externe $TAG" \
            --notes "Nouvelle version de LCE, le cerveau externe pour les TDAH. Télécharge cerveau-externe.apk ci-dessous et installe-le par-dessus l'ancienne version : tes données sont gardées." \
            --latest
